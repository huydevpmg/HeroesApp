<div class="chat-container">
  <div class="chat-main" [class.expanded]="!showRightbar">
    <ng-container *ngIf="selectedConversation$ | async as conversation; else noConversation">
      <div class="chat-header">
        <div class="d-flex align-items-center">
          <div class="avatar">
            <img
              [src]="'https://st4.depositphotos.com/34939642/39599/v/450/depositphotos_395993304-stock-illustration-avatar-man-long-hair-vector.jpg'"
              [alt]="conversation.name">
            <ng-container *ngIf="(otherUserId$ | async) as otherUserId">
              <ng-container *ngIf="(onlineUsers$ | async) as onlineUsers">
                <span class="status-badge" [class.online]="otherUserId && onlineUsers.includes(otherUserId)"
                  [class.offline]="!otherUserId || !onlineUsers.includes(otherUserId)">
                </span>
              </ng-container>
            </ng-container>
          </div>
          <div class="ms-3">
            <h6 class="mb-0">{{ conversation.name }}</h6>
            <small class="text-muted" *ngIf="(typingUsers$ | async)?.length">
              {{ (typingUsers$ | async)?.length }} {{ (typingUsers$ | async)?.length === 1 ? 'person' : 'people' }}
              typing...
            </small>
            <ng-container *ngIf="(otherUserId$ | async) as otherUserId">
              <ng-container *ngIf="(onlineUsers$ | async) as onlineUsers">
                <small class="text-muted" *ngIf="!(typingUsers$ | async)?.length">
                  {{ otherUserId && onlineUsers.includes(otherUserId) ? 'Online' : 'Offline' }}
                </small>
              </ng-container>
            </ng-container>
          </div>
        </div>
        <div class="chat-actions">
          <button class="btn btn-link" (click)="toggleRightbar()">
            <i class="bi bi-info-circle"></i>
          </button>
        </div>
      </div>

      <div class="chat-messages" #messagesContainer>
        <div *ngIf="loading$ | async" class="text-center p-3">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div *ngIf="error$ | async as error" class="alert alert-danger m-3">
          {{ error }}
        </div>

        <ng-container *ngFor="let message of messages$ | async">
          <!-- Text Message -->
          <app-text-message *ngIf="!message.attachments?.length && !message.parentMessage" [message]="message"
            [conversationId]="conversation._id!">
          </app-text-message>

          <!-- Media Message -->
          <app-media-message
            *ngIf="!!message.attachments && message.attachments.length && isMediaAttachment(message.attachments[0])"
            [message]="message" [conversationId]="conversation._id!">
          </app-media-message>

          <!-- Attachment Message -->
          <app-attachment-message
            *ngIf="!!message.attachments && message.attachments.length && !isMediaAttachment(message.attachments[0])"
            [message]="message" [conversationId]="conversation._id!">
          </app-attachment-message>

          <!-- Reply Message -->
          <app-reply-message *ngIf="message.parentMessage" [message]="message" [conversationId]="conversation._id!">
          </app-reply-message>
        </ng-container>
      </div>

      <div class="chat-input">
        <div class="input-group align-items-end">
          <button class="btn btn-link">
            <i class="bi bi-emoji-smile"></i>
          </button>
          <input type="text" class="form-control" placeholder="Type a message..." #messageInput
            (keyup.enter)="sendMessageWithFiles(messageInput.value); messageInput.value = ''">
          <input type="file" #fileInput multiple style="display:none" (change)="onFileSelected($event)">
          <button class="btn btn-link" (click)="fileInput.click()">
            <i class="bi bi-paperclip"></i>
          </button>
          <button class="btn btn-primary" [disabled]="uploading"
            (click)="sendMessageWithFiles(messageInput.value); messageInput.value = ''">
            <i class="bi bi-send"></i>
          </button>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-2" *ngIf="previews.length">
          <ng-container *ngFor="let preview of previews; let i = index">
            <div class="position-relative">
              <img *ngIf="preview" [src]="preview" style="max-width: 80px; max-height: 80px; border-radius: 8px;">
              <div *ngIf="!preview"
                class="file-icon-preview bg-light border rounded d-flex align-items-center justify-content-center"
                style="width:80px;height:80px;">
                <i class="bi bi-file-earmark-text fs-2 text-secondary"></i>
              </div>
              <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0"
                (click)="selectedFiles.splice(i,1); previews.splice(i,1)">
                <i class="bi bi-x"></i>
              </button>
            </div>
          </ng-container>
        </div>
      </div>
    </ng-container>
    <ng-template #noConversation>
      <div class="d-flex flex-column align-items-center justify-content-center h-100 w-100" style="min-height:400px;">
        <img src="https://cdn-icons-png.flaticon.com/512/3095/3095583.png" alt="Select conversation"
          style="width:120px;height:120px;opacity:0.5;">
        <div class="mt-3 fs-4 text-muted">Select a conversation to chat</div>
      </div>
    </ng-template>
  </div>

  <app-chat-info *ngIf="selectedConversation$ | async" [isVisible]="showRightbar"
    (close)="toggleRightbar()"></app-chat-info>
</div>
