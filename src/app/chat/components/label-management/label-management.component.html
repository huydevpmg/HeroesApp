<div *ngIf="modalState === LabelModalState.Main" class="modal fade show d-block modal-overlay">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header bg-white text-dark align-items-center">
        <h4 class="modal-title fw-bold mb-0">Label Management</h4>
        <button type="button" class="btn-close" (click)="closeAllModals()"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="labels && labels.length > 0; else noLabels">
          <div *ngFor="let label of labels"
            class="d-flex align-items-center mb-2 gap-2 border rounded px-2 py-1 bg-light label-row">
            <svg width="32" height="20" viewBox="0 0 80 60"
              style="vertical-align: middle; margin-right: 6px; flex-shrink: 0;">
              <g transform="translate(8, 4) scale(1.25)">
                <path [attr.fill]="label.color" d="M0 0H32L48 20L32 40H0V0Z" />
              </g>
            </svg>
            <span class="flex-grow-1 fw-normal text-dark text-truncate ms-2">{{ label.name }}</span>
            <span class="label-actions d-flex gap-1 align-items-center ms-auto">
              <button class="btn btn-sm btn-outline-secondary px-2 py-1 d-flex align-items-center"
                (click)="openEditLabelModal(label)" title="Edit label">
                <i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-secondary px-2 py-1 d-flex align-items-center"
                (click)="deleteLabel(label)" title="Delete label"><i class="bi bi-trash"></i></button>
            </span>
          </div>
        </div>
        <ng-template #noLabels>
          <div class="text-muted fst-italic text-center">No labels found.</div>
        </ng-template>
      </div>
      <div class="modal-footer">
        <button class="btn btn-dark w-100 mb-2" (click)="openAddLabelModal()">Add new label</button>
      </div>
    </div>
  </div>
</div>

<div *ngIf="modalState === LabelModalState.Edit" class="modal fade show d-block modal-overlay" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header bg-white text-dark align-items-center" style="border-radius: 12px 12px 0 0;">
        <h5 class="modal-title fw-bold mb-0">Edit Label</h5>
        <button type="button" class="btn-close" (click)="closeAllModals()"></button>
      </div>
      <form (ngSubmit)="saveLabel()">
        <div class="modal-body d-flex flex-column gap-3">
          <div class="position-relative mb-2">
            <input type="text" class="form-control" placeholder="Label name" [(ngModel)]="labelForm.name" name="name"
              required />
            <span class="color-input-dot" [style.background]="labelForm.color"
              (click)="showColorTooltip = !showColorTooltip" title="Choose label color"></span>
            <div *ngIf="showColorTooltip" class="color-tooltip">
              <label *ngFor="let color of colors" class="color-choice-label">
                <input type="radio" name="labelColor" [value]="color" [(ngModel)]="labelForm.color" class="d-none" />
                <span class="color-choice-dot" [style.background]="color"
                  [class.selected]="labelForm.color === color"></span>
              </label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dark px-3" type="submit">{{ labelForm._id ? 'Save' : 'Add' }}</button>
          <button class="btn btn-outline-secondary px-3" type="button" (click)="closeEditLabelModal()">Back</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div *ngIf="modalState === LabelModalState.Add" class="modal fade show d-block modal-overlay" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header bg-white text-dark align-items-center">
        <h5 class="modal-title fw-bold mb-0">Add New Label</h5>
        <button type="button" class="btn-close"
          (click)="closeAllModals()"></button>
      </div>
      <form (ngSubmit)="saveLabel()">
        <div class="modal-body d-flex flex-column gap-3">
          <div class="position-relative mb-2">
            <input type="text" class="form-control" placeholder="Label name" [(ngModel)]="labelForm.name" name="name"
              required />
            <span class="color-input-dot" [style.background]="labelForm.color"
              (click)="showColorTooltip = !showColorTooltip" title="Choose label color"></span>
            <div *ngIf="showColorTooltip" class="color-tooltip">
              <label *ngFor="let color of colors" class="color-choice-label">
                <input type="radio" name="labelColor" [value]="color" [(ngModel)]="labelForm.color" class="d-none" />
                <span class="color-choice-dot" [style.background]="color"
                  [class.selected]="labelForm.color === color"></span>
              </label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-dark px-3" type="submit">{{ labelForm._id ? 'Save' : 'Add' }}</button>
          <button class="btn btn-outline-secondary px-3" type="button"
            (click)="closeAddLabelModal()">Back</button>
        </div>
      </form>
    </div>
  </div>
</div>
