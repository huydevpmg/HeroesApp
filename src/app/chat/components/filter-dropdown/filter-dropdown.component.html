<div ngbDropdown class="position-relative">

  <button ngbDropdownToggle class="filter-btn ms-2" title="Filter conversations">
    <i class="bi bi-funnel"></i>
  </button>

  <div ngbDropdownMenu class="filter-dropdown shadow rounded p-3"
    style="position: absolute; right: 0; top: 40px; min-width: 220px; background: #fff; z-index: 1000;">

    <!-- Filter by status -->
    <div class="mb-2">
      <label class="fw-bold mb-2">Filter by status</label>
      <div class="d-flex flex-column gap-2">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="statusFilter" id="statusAll"
            [checked]="selectedStatus === 'all'" (change)="selectStatus('all')">
          <label class="form-check-label" for="statusAll">All</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="statusFilter" id="statusUnread"
            [checked]="selectedStatus === 'unread'" (change)="selectStatus('unread')">
          <label class="form-check-label" for="statusUnread">Unread</label>
        </div>
      </div>
    </div>

    <hr class="my-2" />

    <!-- Filter by label -->
    <div>
      <label class="fw-bold mb-1">Filter by label</label>
      <div class="d-flex flex-column gap-2">
        <div *ngFor="let label of labels" class="form-check">
          <input class="form-check-input" type="checkbox" [id]="'label-' + label._id"
            [checked]="selectedLabels.includes(label._id!)" (change)="toggleLabel(label._id!)"
            style="font-size: 18px; cursor: pointer;">
          <label class="form-check-label d-flex align-items-center" [for]="'label-' + label._id"
            style="cursor: pointer;">
            <svg width="30" height="28" viewBox="4 0 24 24">
              <path d="M4 4H20L28 12L20 20H4V4Z" [attr.fill]="label.color" />
            </svg>
            <span class="ms-2">{{ label.name }}</span>
          </label>
        </div>
      </div>
    </div>

  </div>
</div>
